# The player, in the palette (NULL.md §4.6, §7.1).
#
# mpv's default on-screen controller is a floating, rounded, translucent bar
# with a filled progress track and icon glyphs from its own font -- four things
# this design system does not do. It is turned off and replaced by mpv's plain
# on-screen text, which is text.

# --- no toolkit chrome ---------------------------------------------------
osc=no
border=no
osd-bar=no
title=${filename}
background-color='#05060a'
osd-back-color='#05060a'
osd-color='#ffefe6'
osd-border-color='#05060a'
osd-border-size=0
osd-shadow-offset=0
osd-font='Terminus'
osd-font-size=18
osd-spacing=0
osd-margin-x=12
osd-margin-y=12

# The status line is a line of text, shown only while something changes.
osd-duration=1200
osd-level=1
osd-status-msg=${time-pos} / ${duration}   ${percent-pos}%

# --- behaviour a person expects ------------------------------------------
keep-open=yes
save-position-on-quit=yes
# An audio file has no video to draw, so the window shows the one thing this
# system draws on empty states rather than a black rectangle: nothing at all,
# on the palette ground.
audio-display=no
force-window=yes

# Subtitles: the same typeface as everything else, and a rule rather than a
# filled box behind them.
sub-font='Terminus'
sub-font-size=36
sub-color='#ffefe6'
sub-border-color='#05060a'
sub-border-size=2
sub-back-color='#00000000'
sub-shadow-offset=0
