# The firewall's kernel side, loaded early and in parallel.
#
# nftables.service took 766ms on the test install, of which about 30ms was the
# ruleset -- the rest was modprobe, walked one module at a time from inside
# `nft -f`. That happens at network-pre.target, on the ordering chain that ends
# at the greeter, so every millisecond of it is a millisecond before login.
#
# systemd-modules-load.service runs at sysinit, alongside udev and tmpfiles,
# where nothing is waiting on it. Same work, off the critical path.
#
# Derived from `lsmod` after the ruleset in config/nftables/nulllinux.nft was
# applied, so these are exactly the modules it needs and no others. A rule
# added there that needs a tenth module still works -- nft loads it -- it just
# pays for it on the critical path again.
nf_tables
nf_conntrack
nf_defrag_ipv4
nf_defrag_ipv6
nft_ct
nft_reject
nft_reject_inet
nf_reject_ipv4
nf_reject_ipv6
