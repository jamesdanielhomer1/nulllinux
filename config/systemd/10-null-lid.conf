# What closing the lid does (NULL.md §8.5-adjacent).
#
# THERE WAS NO DEFAULT. bin/null-settings can change this -- it writes
# /etc/systemd/logind.conf.d/50-null-lid.conf -- but nothing ever set one, so
# an installed machine used logind's built-in behaviour, which nobody here
# chose and which nothing recorded.
#
# 10-, so this is the DEFAULT and null-settings' 50- file overrides it: systemd
# reads drop-ins in lexical order and the last writer wins.
#
# This is not the idle ladder. The ladder is a TIMER -- dim, blank, lock,
# suspend after so many minutes -- and it is off in config/sway/config at
# James's request. Closing a lid is a deliberate act by a person who is
# leaving, and a laptop that stays awake in a bag gets hot and arrives flat.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend

# DOCKED IS DIFFERENT. With an external monitor attached, closing the lid is
# how a laptop is used at a desk, not how it is put away. Suspending there is
# the behaviour people file bugs about.
HandleLidSwitchDocked=ignore
