# The keys.
#
# These follow OMARCHY's bindings, because they are the ones in this user's
# hands. Where Omarchy names a Hyprland-only concept (window groups, pseudo
# tiling, monitor scaling cycles) there is no binding rather than an
# approximation on the same key: a key that does something *nearly* like the
# muscle memory expects is worse than one that does nothing.
#
# Bindings that were this system's own and are not Omarchy's have been removed,
# with two exceptions, both stated:
#
#   * HARDWARE KEYS. Volume, brightness and media are the machine's, not a
#     desktop's, and Omarchy's own set is the same idea.
#   * THE COLUMN. It is this desktop's one structural difference from Omarchy,
#     so it takes Omarchy's "toggle the top bar" key, which is the nearest
#     thing to it that Omarchy has.
#
# Every binding carries a `#:` description. Without one it cannot appear in the
# generated key list and cannot be audited (§8.3, §10.4).

# --- applications ---
#: Terminal
bindsym $mod+Return exec foot
#: File manager
bindsym $mod+Shift+f exec $null/bin/null-filemanager
#: Browser
bindsym $mod+Shift+b exec firefox

# --- windows ---
#: Close the focused window
bindsym $mod+w kill
#: Toggle the split direction
bindsym $mod+j layout toggle split
#: Float or tile the focused window
bindsym $mod+t floating toggle
#: Fullscreen
bindsym $mod+f fullscreen
#: Focus left
bindsym $mod+Left focus left
#: Focus down
bindsym $mod+Down focus down
#: Focus up
bindsym $mod+Up focus up
#: Focus right
bindsym $mod+Right focus right
#: Swap the window left
bindsym $mod+Shift+Left move left
#: Swap the window down
bindsym $mod+Shift+Down move down
#: Swap the window up
bindsym $mod+Shift+Up move up
#: Swap the window right
bindsym $mod+Shift+Right move right
#: Focus the next window
bindsym Mod1+Tab focus next
#: Focus the previous window
bindsym Mod1+Shift+Tab focus prev
#: Widen the window
bindsym $mod+equal resize grow width 40px
#: Narrow the window
bindsym $mod+minus resize shrink width 40px
#: Heighten the window
bindsym $mod+Shift+equal resize grow height 40px
#: Shorten the window
bindsym $mod+Shift+minus resize shrink height 40px

# --- workspaces ---
#: Workspace 1
bindsym $mod+1 workspace number 1
#: Workspace 2
bindsym $mod+2 workspace number 2
#: Workspace 3
bindsym $mod+3 workspace number 3
#: Workspace 4
bindsym $mod+4 workspace number 4
#: Workspace 5
bindsym $mod+5 workspace number 5
#: Workspace 6
bindsym $mod+6 workspace number 6
#: Workspace 7
bindsym $mod+7 workspace number 7
#: Workspace 8
bindsym $mod+8 workspace number 8
#: Workspace 9
bindsym $mod+9 workspace number 9
#: Workspace 10
bindsym $mod+0 workspace number 10
#: Move the window to workspace 1
bindsym $mod+Shift+1 move container to workspace number 1
#: Move the window to workspace 2
bindsym $mod+Shift+2 move container to workspace number 2
#: Move the window to workspace 3
bindsym $mod+Shift+3 move container to workspace number 3
#: Move the window to workspace 4
bindsym $mod+Shift+4 move container to workspace number 4
#: Move the window to workspace 5
bindsym $mod+Shift+5 move container to workspace number 5
#: Move the window to workspace 6
bindsym $mod+Shift+6 move container to workspace number 6
#: Move the window to workspace 7
bindsym $mod+Shift+7 move container to workspace number 7
#: Move the window to workspace 8
bindsym $mod+Shift+8 move container to workspace number 8
#: Move the window to workspace 9
bindsym $mod+Shift+9 move container to workspace number 9
#: Move the window to workspace 10
bindsym $mod+Shift+0 move container to workspace number 10
#: Next workspace
bindsym $mod+Tab workspace next
#: Previous workspace
bindsym $mod+Shift+Tab workspace prev
#: The workspace before this one
bindsym $mod+Ctrl+Tab workspace back_and_forth
#: Show the scratchpad
bindsym $mod+s scratchpad show
#: Move the window to the scratchpad
bindsym $mod+Alt+s move scratchpad

# --- menus ---
#
# Every one of these opens IN THE COLUMN: the column becomes that topic and
# pressing the same key again puts it back (§7.3). They are not bare processes
# -- a menu spawned from a key binding has no terminal to draw in, and draws
# nothing at all, which is exactly what the previous bindings did.
#: Applications
bindsym $mod+space exec $null/render/target/release/column --send open apps
#: The menu
bindsym $mod+Alt+space exec $null/render/target/release/column --send open main
#: System
bindsym $mod+Escape exec $null/render/target/release/column --send open system
#: Every key binding, read live
bindsym $mod+k exec $null/render/target/release/column --send open keys
#: Capture
bindsym $mod+Ctrl+c exec $null/render/target/release/column --send open capture
#: Audio
bindsym $mod+Ctrl+a exec $null/render/target/release/column --send open audio
#: Bluetooth
bindsym $mod+Ctrl+b exec $null/render/target/release/column --send open bluetooth
#: Wi-Fi
bindsym $mod+Ctrl+w exec $null/render/target/release/column --send open network
#: Activity
bindsym $mod+Ctrl+t exec $null/render/target/release/column --send open monitor
#: Toggles
bindsym $mod+Ctrl+o exec $null/render/target/release/column --send open toggle
#: Hardware
bindsym $mod+Ctrl+h exec $null/render/target/release/column --send open hardware

#: The settings panel -- brightness, power plan, idle timers, radios
bindsym $mod+Ctrl+s exec $null/render/target/release/column --send open settings

#: NetworkManager's own editor, for the things a picker should not attempt
bindsym $mod+Ctrl+e exec $null/render/target/release/column --send open netconfig

#: The PipeWire mixer -- per-stream volume and routing
bindsym $mod+Ctrl+m exec $null/render/target/release/column --send open mixer

#: The power profile
bindsym $mod+Ctrl+p exec $null/render/target/release/column --send open power-profile

#: Settings: display
bindsym $mod+Ctrl+d exec $null/render/target/release/column --send open settings-display

#: Settings: keyboard, touchpad and pointer
bindsym $mod+Ctrl+k exec $null/render/target/release/column --send open settings-keyboard

# --- the session ---
#: Lock the session
bindsym $mod+Ctrl+l exec swaylock -f
#: Screenshot
bindsym Print exec $null/bin/null-capture screenshot
#: Screen recording
bindsym Mod1+Print exec $null/render/target/release/column --send open capture
#: Colour under the pointer
bindsym $mod+Print exec $null/bin/null-capture colour
#: Dismiss the last notification
bindsym $mod+comma exec dunstctl close
#: Dismiss every notification
bindsym $mod+Shift+comma exec dunstctl close-all
#: Silence notifications
bindsym $mod+Ctrl+comma exec dunstctl set-paused toggle
#: Toggle idle locking
bindsym $mod+Ctrl+i exec $null/bin/null-idle toggle
#: Toggle the night light
bindsym $mod+Ctrl+n exec $null/bin/null-nightlight toggle

# --- the column ---
#
# Omarchy's "toggle the top bar" key. The column is the nearest thing this
# desktop has to that surface, and giving it the same key keeps one habit
# rather than inventing a new one.
#: Pin the column open
bindsym $mod+Shift+space exec $null/render/target/release/column --send pin

# --- hardware keys ---
#
# The machine's, not the desktop's. --locked so they work at the lock screen,
# which is when a volume key is most likely to be wanted.
#: Volume up
bindsym --locked XF86AudioRaiseVolume exec $null/bin/null-volume up
#: Volume down
bindsym --locked XF86AudioLowerVolume exec $null/bin/null-volume down
#: Mute the output
bindsym --locked XF86AudioMute exec $null/bin/null-volume mute
#: Mute the microphone
bindsym --locked XF86AudioMicMute exec $null/bin/null-volume micmute
#: Screen brighter
bindsym --locked XF86MonBrightnessUp exec $null/bin/null-brightness up
#: Screen dimmer
bindsym --locked XF86MonBrightnessDown exec $null/bin/null-brightness down
#: Power menu
bindsym --locked XF86PowerOff exec $null/render/target/release/column --send open system
