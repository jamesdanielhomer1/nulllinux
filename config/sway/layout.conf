# The layout.
#
# Dwindle, and only dwindle: every new window splits the focused one along its
# longer axis. bin/null-dwindle keeps that true continuously.
#
# `default_orientation auto` is the compositor's own version of the same idea,
# but it decides ONCE for a fresh container and then leaves it, so the second
# split down any branch inherits a direction chosen for a differently shaped
# space. It is set anyway: it makes the very first split correct before the
# daemon has seen an event, and it is the correct behaviour if the daemon is
# not running at all.
default_orientation auto
workspace_layout default

exec_always NULL_ROOT=$null $null/bin/null-dwindle
