# btop configuration for hosting in the column (NULL.md §7.6, §10.5).
#
# Measured before this file existed: 22 distinct unrenderable codepoints, 645
# cells, at 84x56. The two causes were btop's shipped defaults.
#
# graph_symbol "braille" is the big one -- 528 of those 645 cells were U+28C0
# alone. "tty" draws the graphs with characters the font has.
graph_symbol = "tty"
graph_symbol_cpu = "tty"
graph_symbol_gpu = "tty"
graph_symbol_mem = "tty"
graph_symbol_net = "tty"
graph_symbol_proc = "tty"

# Rounded corners are U+256D..U+2570, which this console font does not carry.
# Line art is fine; it just has to be line art the font has (§7.1).
rounded_corners = False

# The nullLinux draws its own chrome around the column.
show_battery = False
theme_background = False
truecolor = True
shown_boxes = "cpu mem net proc"
update_ms = 1000
