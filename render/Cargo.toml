[package]
name = "render"
version = "0.1.0"
edition = "2021"

[lib]
name = "nulllinux"
path = "src/lib.rs"

[[bin]]
name = "render"
path = "src/main.rs"

[[bin]]
name = "column"
path = "src/bin/column.rs"

[[bin]]
name = "bar"
path = "src/bin/bar.rs"

[[bin]]
name = "dwindle"
path = "src/bin/dwindle.rs"

[dependencies]
zstd = "0.13"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
