[package]
name = "render"
version = "0.1.0"
edition = "2021"

[lib]
name = "nulllinux"
path = "src/lib.rs"

[[bin]]
name = "render"
path = "src/main.rs"

[[bin]]
name = "column"
path = "src/bin/column.rs"

[[bin]]
name = "bar"
path = "src/bin/bar.rs"

[[bin]]
name = "dwindle"
path = "src/bin/dwindle.rs"

[[bin]]
name = "lock"
path = "src/bin/lock.rs"

[dependencies]
zstd = "0.13"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
serde_json = "1"
libc = "0.2"

[features]
lock-test-hook = []

[profile.release]
opt-level = 3
lto = true
# codegen-units = 1 gives the optimiser the whole crate at once -- a little more
# speed on top of LTO, at the cost of a slower build (paid once, on the build
# host, never on the machine). panic = "abort" drops the unwinding tables: these
# are supervised daemons (lib/supervise.sh restarts a died renderer) with no
# catch_unwind anywhere, so a panic should end the process cleanly and be
# respawned, not unwind through a half-committed Wayland surface. Smaller
# binaries too, which a potato's disk and page cache both prefer.
codegen-units = 1
panic = "abort"
